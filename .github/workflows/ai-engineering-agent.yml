name: Vantoris AI Engineering Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the bug, feature, audit, or implementation. The agent may change any relevant repository files."
        required: true
        type: string
      run_checks:
        description: "Run build and syntax checks before opening a PR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vantoris-ai-agent-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement task with Codex
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          ref: recovery/merge-vantoris-live
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare task prompt
        env:
          AGENT_TASK: ${{ inputs.task }}
          RUN_CHECKS: ${{ inputs.run_checks }}
        run: |
          cat > .agent-task-prompt.md <<'PROMPT'
          You are the senior autonomous software engineer for VANTORIS X MONEY.
          Read AGENTS.md and .github/copilot-instructions.md first.
          You have authority to inspect and modify any relevant file in this repository.
          Do not merely advise: implement the task, inspect callers and dependencies, add or update tests where feasible, and fix issues found.
          Preserve member/operator separation, privacy, server-side authorization, ledger integrity, auditability, and honest integration status.
          Never add fake success responses, invented financial data, secrets, or production actions that bypass required authorization.
          Do not change main or deploy. This run will create a reviewable pull request.
          Report exact checks run and unresolved blockers in your final response.
          PROMPT
          printf '\n## Requested task\n%s\n' "$AGENT_TASK" >> .agent-task-prompt.md
          printf '\n## Check setting\nRun build and syntax checks: %s\n' "$RUN_CHECKS" >> .agent-task-prompt.md

      - name: Run Codex engineering agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .agent-task-prompt.md
          effort: high
          output-file: .agent-final-report.md

      - name: Run production build and server syntax checks
        id: checks
        if: ${{ inputs.run_checks }}
        run: |
          node --check netlify/functions/ask.mjs
          node --check server/llm-proxy.mjs
          npm run build

      - name: Create review branch and pull request
        if: always() && steps.codex.outcome == 'success'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TASK_TITLE: ${{ inputs.task }}
        run: |
          set -euo pipefail
          rm -f .agent-task-prompt.md .agent-final-report.md
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Codex made no repository changes; no pull request created."
            exit 0
          fi
          branch="agent/task-$RUN_ID-$RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "agent: implement requested Vantoris improvements"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          body_file="$(mktemp)"
          {
            printf '## AI engineering task\n\n%s\n\n' "$TASK_TITLE"
            printf '## Verification\n- Generated by the Vantoris AI Engineering Agent workflow.\n- Build/syntax checks requested: %s\n- Build/syntax step outcome: %s\n' '${{ inputs.run_checks }}' '${{ steps.checks.outcome }}'
            printf '\nReview all changes before merging. This workflow never deploys to production.\n'
          } > "$body_file"
          gh pr create --repo "$GITHUB_REPOSITORY" --base recovery/merge-vantoris-live --head "$branch" --title "AI agent: implement Vantoris improvements" --body-file "$body_file"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish agent report as workflow summary
        if: always()
        env:
          CODEX_REPORT: ${{ steps.codex.outputs.final-message }}
        run: |
          {
            echo "## Vantoris AI Engineering Agent"
            echo
            echo "$CODEX_REPORT"
            echo
            echo "Review the workflow log and pull request before merging. No production deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
