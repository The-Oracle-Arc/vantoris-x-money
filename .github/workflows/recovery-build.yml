name: Recovery build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recovery-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE44_APP_ID: 6a3d85c1632966fefe16f3d4
      VITE_BASE44_SERVER_URL: https://vantoris.base44.app
      VITE_BASE44_APP_BASE_URL: https://vantoris-platform.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check netlify/functions/ask.mjs && node --check server/llm-proxy.mjs
      - name: Validate entity JSON and security rules
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const dir = 'base44/entities';
          const files = readdirSync(dir).filter((name) => name.endsWith('.jsonc'));
          if (!files.length) throw new Error('No entity schemas found');
          for (const file of files) {
            const schema = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            if (!schema.name || schema.type !== 'object') throw new Error(`Invalid entity schema: ${file}`);
          }
          for (const name of ['Account', 'Transaction', 'WithdrawalRequest', 'Notification', 'User']) {
            const schema = JSON.parse(readFileSync(`${dir}/${name}.jsonc`, 'utf8'));
            if (!schema.rls) throw new Error(`Missing row-level security rules: ${name}`);
          }
          console.log(`Validated ${files.length} entity schemas and critical RLS definitions.`);
          NODE
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
